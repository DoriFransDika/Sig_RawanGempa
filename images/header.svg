<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SIG Rawan Gempa - Sistem Informasi Mitigasi Gempa Indonesia" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6EF"/>
      <stop offset="0.55" stop-color="#FDE6D6"/>
      <stop offset="1" stop-color="#F9CDB3"/>
    </linearGradient>
    <linearGradient id="mtn1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A27E" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E8704A" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="mtn2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9822B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#B5532F" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8704A"/>
      <stop offset="1" stop-color="#F4A261"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8704A" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#E8704A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8704A" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E8704A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#E8704A" stop-opacity="0"/>
    </radialGradient>
    <style>
      .title { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 800; font-size: 74px; letter-spacing: -1px; }
      .sub   { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 26px; fill: #8A5A44; }
      .pill  { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 17px; fill: #B5532F; }
      .loc   { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 600; font-size: 14px; letter-spacing: 5px; fill: #C98F73; }
      .ring  { fill: none; stroke: #E8704A; stroke-width: 2; transform-origin: 1075px 150px; animation: pulse 3.6s ease-out infinite; opacity: 0; }
      .r2 { animation-delay: 1.2s; } .r3 { animation-delay: 2.4s; }
      .line  { fill: none; stroke: url(#wave); stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 1400; stroke-dashoffset: 1400; animation: draw 3.2s ease-out forwards; }
      .dot   { fill: #E8704A; animation: blink 1.8s ease-in-out infinite; }
      @keyframes pulse { 0% { transform: scale(0.2); opacity: 0.7; } 100% { transform: scale(1.7); opacity: 0; } }
      @keyframes draw  { to { stroke-dashoffset: 0; } }
      @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- Grid dots -->
  <g fill="#E8704A" opacity="0.18">
    <circle cx="40" cy="250" r="2"/><circle cx="64" cy="250" r="2"/><circle cx="88" cy="250" r="2"/>
    <circle cx="40" cy="274" r="2"/><circle cx="64" cy="274" r="2"/><circle cx="88" cy="274" r="2"/>
    <circle cx="40" cy="298" r="2"/><circle cx="64" cy="298" r="2"/><circle cx="88" cy="298" r="2"/>
  </g>

  <!-- Epicenter glow + ripples -->
  <circle cx="1075" cy="150" r="170" fill="url(#glow)"/>
  <circle class="ring" cx="1075" cy="150" r="90"/>
  <circle class="ring r2" cx="1075" cy="150" r="90"/>
  <circle class="ring r3" cx="1075" cy="150" r="90"/>
  <circle cx="1075" cy="150" r="22" fill="#E8704A" opacity="0.18"/>
  <circle class="dot" cx="1075" cy="150" r="9"/>

  <!-- Mountains -->
  <path d="M0 360 L0 285 L120 225 L210 262 L330 190 L450 270 L540 235 L640 285 L760 250 L880 295 L1000 255 L1120 290 L1280 240 L1280 360 Z" fill="url(#mtn1)"/>
  <path d="M0 360 L0 320 L140 285 L260 318 L400 270 L520 315 L680 292 L820 330 L960 300 L1100 328 L1280 295 L1280 360 Z" fill="url(#mtn2)"/>

  <!-- Seismic waveform -->
  <polyline class="line" points="560,150 640,150 665,150 680,120 695,185 712,95 730,210 748,130 762,165 776,150 860,150 880,150 895,132 908,170 922,150 1000,150 1030,150 1045,118 1058,196 1075,70 1092,232 1108,128 1120,166 1135,150 1280,150"/>

  <!-- Layers icon -->
  <g transform="translate(70,70)">
    <path d="M50 8 L96 32 L50 56 L4 32 Z" fill="#F9CDB3" stroke="#E8704A" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M4 50 L50 74 L96 50" fill="none" stroke="#E8704A" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M4 68 L50 92 L96 68" fill="none" stroke="#D9822B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M50 18 L76 32 L50 46 L24 32 Z" fill="url(#accent)"/>
  </g>
  <rect x="190" y="66" width="3" height="104" rx="1.5" fill="#E8704A"/>

  <!-- Title -->
  <text class="title" x="215" y="124"><tspan fill="#5A2A1A">SIG </tspan><tspan fill="#E8704A">Rawan Gempa</tspan></text>
  <text class="sub" x="217" y="168">Sistem Informasi Mitigasi Gempa Indonesia</text>

  <!-- Pill -->
  <rect x="217" y="192" width="206" height="38" rx="19" fill="#FFF1E8" stroke="#E8704A" stroke-opacity="0.55" stroke-width="1.5"/>
  <circle cx="240" cy="211" r="5" fill="#E8704A"/>
  <text class="pill" x="256" y="217">WebGIS Application</text>

  <!-- Location -->
  <text class="loc" x="70" y="336">KABUPATEN TANAH DATAR  ·  KOTA PADANG PANJANG</text>
</svg>
