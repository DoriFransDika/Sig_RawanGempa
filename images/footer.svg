<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="Footer SIG Rawan Gempa" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6EF" stop-opacity="0"/>
      <stop offset="1" stop-color="#F9CDB3"/>
    </linearGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A27E" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#E8704A" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9822B" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#B5532F" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8704A" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E8704A" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#E8704A" stop-opacity="0"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 700; font-size: 20px; fill: #5A2A1A; }
      .s { font-family: 'Segoe UI','Helvetica Neue',Arial,sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 4px; fill: #8A5A44; }
      .line { fill: none; stroke: url(#wave); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;
              stroke-dasharray: 1600; stroke-dashoffset: 1600; animation: draw 3.5s ease-out forwards; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
    </style>
  </defs>

  <rect width="1280" height="170" fill="url(#bg)"/>

  <!-- Mountains -->
  <path d="M0 170 L0 120 L130 78 L240 112 L380 58 L520 118 L640 90 L760 124 L900 70 L1040 120 L1160 88 L1280 112 L1280 170 Z" fill="url(#m1)"/>
  <path d="M0 170 L0 142 L160 112 L300 140 L460 104 L620 142 L780 118 L940 146 L1100 116 L1280 138 L1280 170 Z" fill="url(#m2)"/>

  <!-- Waveform -->
  <polyline class="line" points="0,60 330,60 360,60 372,42 384,80 398,28 412,92 426,52 440,64 470,60 760,60 790,60 802,46 814,76 826,60 1280,60"/>

  <!-- Text -->
  <text class="t" x="640" y="104" text-anchor="middle">🧡 Siaga Gempa, Selamatkan Sesama 🧡</text>
  <text class="s" x="640" y="130" text-anchor="middle">SIG RAWAN GEMPA  ·  TANAH DATAR  ·  PADANG PANJANG</text>
</svg>
